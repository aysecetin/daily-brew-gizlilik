<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daily Brew</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #FAF6EE; --surface: #FFFFFF; --text: #1C130E;
    --muted: #6B5B50; --accent: #C87D55; --border: #E5DACB;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1C130E; --surface: #261A13; --text: #F3E9DC;
      --muted: #A6907F; --accent: #D9946B; --border: #3A281E;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 96px 20px;
    background: var(--bg); color: var(--text);
    font: 16px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  main { max-width: 32rem; margin: 0 auto; }
  h1 { font-size: 2.1rem; letter-spacing: -0.02em; margin: 0 0 8px; }
  p { color: var(--muted); margin: 0 0 32px; }
  a.card {
    display: block; text-decoration: none; color: var(--text);
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; padding: 16px 20px; margin-bottom: 10px;
  }
  a.card:hover { border-color: var(--accent); }
  a.card span { display: block; color: var(--muted); font-size: 0.9rem; }
  footer { margin-top: 40px; color: var(--muted); font-size: 0.9rem; }
  footer a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <h1>Daily Brew</h1>
  <p>Demleme ritüeli temalı bir alışkanlık takip uygulaması, iOS ve Android
  için. Çevrimdışı çalışır ve hesap istemez; ücretsizdir, iki ekranında reklam
  gösterir.</p>

  <a class="card" href="gizlilik.html">
    Gizlilik Politikası
    <span>Kayıtlarınız telefonunuzda kalır; reklamlar için işlenen veriler burada</span>
  </a>

  <footer>
    <a href="mailto:aysebuildss@gmail.com">aysebuildss@gmail.com</a>
  </footer>
</main>
</body>
</html>
